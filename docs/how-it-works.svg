<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 660" width="1100" height="660" role="img" aria-labelledby="t d">
  <title id="t">How savi-sdk works</title>
  <desc id="d">Five steps: install, wrap your client, call as usual, SAVI notes each call, read the results. Local mode keeps everything on your computer. Connected mode sends the same notes to your company's SAVI account.</desc>
  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#0B1B3A" stroke-width="2" stroke-linecap="round"/></marker>
    <style>
      text{font-family:Inter,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;fill:#14161A}
      .h{font-weight:700;font-size:26px;fill:#0B1B3A}
      .sub{font-size:16px;fill:#5B616B}
      .n{font-weight:700;font-size:15px;fill:#9A4A12}
      .st{font-weight:700;font-size:18px;fill:#0B1B3A}
      .b{font-size:15px;fill:#14161A}
      .m{font-family:Consolas,"SF Mono",Menlo,monospace;font-size:14px;fill:#0B1B3A}
      .w{fill:#fff}
      .box{fill:#fff;stroke:#E4E0DA;stroke-width:1.5}
      .lbl{font-weight:700;font-size:16px}
    </style>
  </defs>
  <rect width="1100" height="660" rx="14" fill="#F6F2ED"/>
  <text class="h" x="40" y="52">How savi-sdk works</text>
  <text class="sub" x="40" y="78">Five steps from install to a report you can send. No SAVI account or server needed to start.</text>

  <!-- steps -->
  <g>
    <rect class="box" x="40"  y="104" width="188" height="176" rx="10"/>
    <rect class="box" x="253" y="104" width="188" height="176" rx="10"/>
    <rect class="box" x="466" y="104" width="188" height="176" rx="10"/>
    <rect class="box" x="679" y="104" width="188" height="176" rx="10"/>
    <rect class="box" x="892" y="104" width="168" height="176" rx="10"/>

    <text class="n" x="58" y="134">STEP 1</text>
    <text class="st" x="58" y="160">Install</text>
    <text class="m" x="58" y="196">pip install</text>
    <text class="m" x="58" y="218">"savi-sdk[openai]"</text>
    <text class="b" x="58" y="254">One package.</text>

    <text class="n" x="271" y="134">STEP 2</text>
    <text class="st" x="271" y="160">Wrap your client</text>
    <text class="m" x="271" y="196">SaviOpenAI(</text>
    <text class="m" x="271" y="218">  local_mode=True)</text>
    <text class="b" x="271" y="254">Replaces one line.</text>

    <text class="n" x="484" y="134">STEP 3</text>
    <text class="st" x="484" y="160">Call as usual</text>
    <text class="b" x="484" y="194">Your code is unchanged.</text>
    <text class="b" x="484" y="216">The call goes straight</text>
    <text class="b" x="484" y="238">to your provider.</text>

    <text class="n" x="697" y="134">STEP 4</text>
    <text class="st" x="697" y="160">SAVI notes the call</text>
    <text class="b" x="697" y="192">Model, tokens, time,</text>
    <text class="b" x="697" y="214">failures, repeats, and</text>
    <text class="b" x="697" y="236">cost from your prices.</text>
    <text class="b" x="697" y="262">Streams count too.</text>

    <text class="n" x="910" y="134">STEP 5</text>
    <text class="st" x="910" y="160">Read it</text>
    <text class="b" x="910" y="192">A line per call,</text>
    <text class="b" x="910" y="214">a summary, and</text>
    <text class="m" x="910" y="240">savi-report.html</text>
  </g>

  <!-- arrows -->
  <g stroke="#0B1B3A" stroke-width="2" fill="none" marker-end="url(#ar)">
    <path d="M230 192 H249"/><path d="M443 192 H462"/><path d="M656 192 H675"/><path d="M869 192 H888"/>
  </g>

  <!-- never recorded -->
  <rect x="466" y="300" width="401" height="58" rx="10" fill="#E4F5EC" stroke="#067647" stroke-width="1.5"/>
  <text class="lbl" x="484" y="324" style="fill:#067647">Never recorded by default</text>
  <text class="b" x="484" y="345">What you asked, and what the model answered.</text>
  <path d="M560 282 V300 M780 282 V300" stroke="#067647" stroke-width="1.5" stroke-dasharray="4 4" fill="none"/>

  <!-- optional -->
  <rect x="40" y="300" width="401" height="58" rx="10" fill="#fff" stroke="#E4E0DA" stroke-width="1.5" stroke-dasharray="5 4"/>
  <text class="lbl" x="58" y="324" style="fill:#0B1B3A">Optional add-ons</text>
  <text class="b" x="58" y="345">Personal-data flags: pip install "savi-sdk[pii]"</text>

  <!-- fork -->
  <text class="st" x="40" y="404">Then choose where the notes go</text>

  <!-- local lane -->
  <rect x="40" y="422" width="505" height="200" rx="12" fill="#0B1B3A"/>
  <text class="lbl w" x="64" y="456" style="fill:#FFC699">LOCAL MODE  ·  START HERE</text>
  <text class="w" x="64" y="490" style="font-size:20px;font-weight:700;fill:#fff">Everything stays on this computer.</text>
  <text class="w" x="64" y="520" style="font-size:15px;fill:#D5DBE6">No account. No server. Nothing is sent anywhere.</text>
  <text class="w" x="64" y="546" style="font-size:15px;fill:#D5DBE6">Add your own prices to see cost.</text>
  <text class="w" x="64" y="572" style="font-size:15px;fill:#D5DBE6">Send the report file to anyone.</text>
  <text class="w" x="64" y="602" style="font-family:Consolas,monospace;font-size:14px;fill:#FFC699">python -m savi.local_report --demo</text>

  <!-- connected lane -->
  <rect x="565" y="422" width="495" height="200" rx="12" fill="#fff" stroke="#0B1B3A" stroke-width="1.5"/>
  <text class="lbl" x="589" y="456" style="fill:#9A4A12">CONNECTED MODE  ·  FOR YOUR COMPANY</text>
  <text x="589" y="490" style="font-size:20px;font-weight:700;fill:#0B1B3A">The same notes go to your SAVI account.</text>
  <text class="b" x="589" y="520">Same code, plus a key and a tenant id.</text>
  <text class="b" x="589" y="546">Calls are sent in batches, off the main path.</text>
  <text class="b" x="589" y="572">We set it up with you.</text>
  <text class="m" x="589" y="602" style="fill:#9A4A12">datagras.com/savi/contact</text>
</svg>
