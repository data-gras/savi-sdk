name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Test (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - uses: astral-sh/setup-uv@v3

      # Combining every provider extra (openai, anthropic, google-cloud-aiplatform,
      # boto3, cohere, mistralai, mcp, presidio, spacy) in one install is too large
      # a graph for pip's resolver ("Dependency resolution exceeded maximum depth");
      # uv's resolver handles the same graph in seconds.
      - name: Install with every provider + dev extras
        run: uv pip install --system -e ".[all,dev]"

      - name: Run tests
        run: pytest --tb=short -q

      - name: Run tests with coverage (Python 3.11 only, for the badge)
        if: matrix.python-version == '3.11'
        run: |
          uv pip install --system pytest-cov
          pytest --cov=savi --cov-report=xml --cov-report=term -q

      - name: Upload coverage to Codecov
        if: matrix.python-version == '3.11'
        uses: codecov/codecov-action@v4
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ./coverage.xml
          fail_ci_if_error: false
